<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="brand-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090F" />
      <stop offset="100%" stop-color="#0F1420" />
    </linearGradient>
    <linearGradient id="mark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38E8C6" />
      <stop offset="100%" stop-color="#8B7BFF" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#brand-bg)" />

  <!-- Subtle brand grid -->
  <line x1="400" y1="50" x2="400" y2="400" stroke="#232B3D" stroke-dasharray="6" opacity="0.6" />
  <line x1="100" y1="225" x2="700" y2="225" stroke="#232B3D" stroke-dasharray="6" opacity="0.6" />
  <circle cx="400" cy="225" r="160" fill="none" stroke="#232B3D" stroke-dasharray="4" opacity="0.4" />

  <!-- Center Logo Mark Mockup -->
  <g transform="translate(340, 150) scale(1.5)">
    <rect width="80" height="80" rx="20" fill="#151B2B" stroke="#38E8C6" stroke-width="1.5" />
    <path d="M22 58 V22 h7 l15 24 V22 h7 v36 h-7 L29 34 v24 Z" fill="url(#mark-grad)" />
    <circle cx="56" cy="54" r="4" fill="#FFB547" />
  </g>

  <!-- Typography Logotype -->
  <text x="400" y="325" text-anchor="middle" fill="#E8EEF9" font-family="sans-serif" font-size="28" font-weight="700" letter-spacing="4">NEXORA</text>
  <text x="400" y="350" text-anchor="middle" fill="#8B95AB" font-family="sans-serif" font-size="12" letter-spacing="6">STUDIO &amp; LABS</text>

  <!-- Swatches Bottom Left -->
  <g transform="translate(60, 360)">
    <rect x="0" y="0" width="24" height="24" rx="6" fill="#38E8C6" />
    <rect x="32" y="0" width="24" height="24" rx="6" fill="#FFB547" />
    <rect x="64" y="0" width="24" height="24" rx="6" fill="#8B7BFF" />
    <rect x="96" y="0" width="24" height="24" rx="6" fill="#0F1420" stroke="#232B3D" />
  </g>

  <!-- Spec Tag Top Right -->
  <g transform="translate(620, 60)">
    <rect width="120" height="30" rx="6" fill="#151B2B" stroke="#232B3D" />
    <text x="60" y="19" text-anchor="middle" fill="#8B95AB" font-family="sans-serif" font-size="10">IDENTITY SYSTEM</text>
  </g>
</svg>
