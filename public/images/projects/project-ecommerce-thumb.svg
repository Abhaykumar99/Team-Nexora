<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ecom-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1420" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#ecom-bg)" />

  <!-- E-commerce Store Mockup -->
  <rect x="40" y="30" width="720" height="390" rx="12" fill="#151B2B" stroke="#232B3D" stroke-width="1.5" />
  
  <!-- Store Nav -->
  <rect x="40" y="30" width="720" height="45" rx="12" fill="#0F1420" />
  <text x="70" y="58" fill="#E8EEF9" font-family="sans-serif" font-size="14" font-weight="bold">LUMEN ARCHIVE</text>
  <text x="240" y="57" fill="#8B95AB" font-family="sans-serif" font-size="11">Apparel</text>
  <text x="310" y="57" fill="#8B95AB" font-family="sans-serif" font-size="11">Accessories</text>
  <text x="400" y="57" fill="#8B95AB" font-family="sans-serif" font-size="11">Editorial</text>

  <rect x="670" y="42" width="60" height="24" rx="6" fill="#38E8C6" fill-opacity="0.15" />
  <text x="682" y="58" fill="#38E8C6" font-family="sans-serif" font-size="10" font-weight="bold">Cart (2)</text>

  <!-- Product Grid -->
  <!-- Product 1 -->
  <g transform="translate(70, 95)">
    <rect width="190" height="240" rx="10" fill="#0F1420" stroke="#232B3D" />
    <rect x="15" y="15" width="160" height="150" rx="8" fill="#151B2B" />
    <circle cx="95" cy="90" r="40" fill="#38E8C6" fill-opacity="0.1" />
    <rect x="65" y="70" width="60" height="40" rx="4" fill="#38E8C6" fill-opacity="0.3" />
    <text x="20" y="190" fill="#E8EEF9" font-family="sans-serif" font-size="12" font-weight="600">Minimalist Chrono</text>
    <text x="20" y="215" fill="#38E8C6" font-family="sans-serif" font-size="13" font-weight="bold">$240.00</text>
    <rect x="145" y="195" width="30" height="22" rx="4" fill="#151B2B" stroke="#232B3D" />
    <text x="156" y="210" fill="#E8EEF9" font-family="sans-serif" font-size="12">+</text>
  </g>

  <!-- Product 2 -->
  <g transform="translate(285, 95)">
    <rect width="190" height="240" rx="10" fill="#0F1420" stroke="#232B3D" />
    <rect x="15" y="15" width="160" height="150" rx="8" fill="#151B2B" />
    <circle cx="95" cy="90" r="40" fill="#8B7BFF" fill-opacity="0.1" />
    <rect x="65" y="70" width="60" height="40" rx="4" fill="#8B7BFF" fill-opacity="0.3" />
    <text x="20" y="190" fill="#E8EEF9" font-family="sans-serif" font-size="12" font-weight="600">Leather Tote 01</text>
    <text x="20" y="215" fill="#38E8C6" font-family="sans-serif" font-size="13" font-weight="bold">$185.00</text>
    <rect x="145" y="195" width="30" height="22" rx="4" fill="#151B2B" stroke="#232B3D" />
    <text x="156" y="210" fill="#E8EEF9" font-family="sans-serif" font-size="12">+</text>
  </g>

  <!-- Product 3 -->
  <g transform="translate(500, 95)">
    <rect width="190" height="240" rx="10" fill="#0F1420" stroke="#232B3D" />
    <rect x="15" y="15" width="160" height="150" rx="8" fill="#151B2B" />
    <circle cx="95" cy="90" r="40" fill="#FFB547" fill-opacity="0.1" />
    <rect x="65" y="70" width="60" height="40" rx="4" fill="#FFB547" fill-opacity="0.3" />
    <text x="20" y="190" fill="#E8EEF9" font-family="sans-serif" font-size="12" font-weight="600">Ceramic Vessel</text>
    <text x="20" y="215" fill="#38E8C6" font-family="sans-serif" font-size="13" font-weight="bold">$75.00</text>
    <rect x="145" y="195" width="30" height="22" rx="4" fill="#151B2B" stroke="#232B3D" />
    <text x="156" y="210" fill="#E8EEF9" font-family="sans-serif" font-size="12">+</text>
  </g>

  <!-- Bottom Promo Banner -->
  <rect x="70" y="355" width="620" height="45" rx="8" fill="#0F1420" stroke="#232B3D" />
  <text x="95" y="382" fill="#E8EEF9" font-family="sans-serif" font-size="11">Free worldwide carbon-neutral shipping on orders over $150</text>
</svg>
