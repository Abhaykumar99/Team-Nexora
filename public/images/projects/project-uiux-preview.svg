<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="uiux-prev-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1420" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#uiux-prev-bg)" />

  <text x="60" y="60" fill="#E8EEF9" font-family="sans-serif" font-size="22" font-weight="bold">Design System &amp; Mobile UI Components</text>
  <text x="60" y="85" fill="#8B95AB" font-family="sans-serif" font-size="14">Component kit, token hierarchy, and interactive states</text>

  <!-- Component Card 1: Color tokens -->
  <rect x="60" y="120" width="410" height="200" rx="12" fill="#151B2B" stroke="#232B3D" />
  <text x="85" y="155" fill="#E8EEF9" font-family="sans-serif" font-size="16" font-weight="600">Color Palette &amp; Contrast AA</text>
  <rect x="85" y="180" width="60" height="60" rx="8" fill="#38E8C6" />
  <text x="85" y="260" fill="#E8EEF9" font-family="sans-serif" font-size="11">Mint #38E8C6</text>
  
  <rect x="165" y="180" width="60" height="60" rx="8" fill="#FFB547" />
  <text x="165" y="260" fill="#E8EEF9" font-family="sans-serif" font-size="11">Amber #FFB547</text>
  
  <rect x="245" y="180" width="60" height="60" rx="8" fill="#8B7BFF" />
  <text x="245" y="260" fill="#E8EEF9" font-family="sans-serif" font-size="11">Violet #8B7BFF</text>
  
  <rect x="325" y="180" width="60" height="60" rx="8" fill="#0F1420" stroke="#232B3D" />
  <text x="325" y="260" fill="#E8EEF9" font-family="sans-serif" font-size="11">Dark #0F1420</text>

  <!-- Component Card 2: Interactive Buttons -->
  <rect x="500" y="120" width="440" height="200" rx="12" fill="#151B2B" stroke="#232B3D" />
  <text x="525" y="155" fill="#E8EEF9" font-family="sans-serif" font-size="16" font-weight="600">Button State Variants</text>
  
  <!-- Buttons -->
  <rect x="525" y="180" width="120" height="40" rx="8" fill="#38E8C6" />
  <text x="560" y="205" fill="#04120F" font-family="sans-serif" font-size="12" font-weight="bold">Primary</text>
  
  <rect x="665" y="180" width="120" height="40" rx="8" fill="#0F1420" stroke="#232B3D" />
  <text x="695" y="205" fill="#E8EEF9" font-family="sans-serif" font-size="12">Secondary</text>
  
  <rect x="805" y="180" width="110" height="40" rx="8" fill="none" stroke="#38E8C6" stroke-width="1.5" />
  <text x="840" y="205" fill="#38E8C6" font-family="sans-serif" font-size="12">Outline</text>

  <!-- Typography Card -->
  <rect x="60" y="350" width="880" height="200" rx="12" fill="#151B2B" stroke="#232B3D" />
  <text x="85" y="390" fill="#E8EEF9" font-family="sans-serif" font-size="16" font-weight="600">Typography Scale (Space Grotesk &amp; Inter)</text>
  <text x="85" y="440" fill="#E8EEF9" font-family="sans-serif" font-size="32" font-weight="bold">Display Large 48px / 1.1</text>
  <text x="85" y="480" fill="#8B95AB" font-family="sans-serif" font-size="16">Subheading / Body Regular 16px comfortable line-height for readability</text>
</svg>
