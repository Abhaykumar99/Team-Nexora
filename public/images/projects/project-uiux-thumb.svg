<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="uiux-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151B2B" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>
    <linearGradient id="phone-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7BFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38E8C6" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7BFF" />
      <stop offset="100%" stop-color="#5B49E0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#uiux-bg)" />

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="200" r="180" fill="#8B7BFF" opacity="0.08" filter="blur(40px)" />
  <circle cx="520" cy="240" r="160" fill="#38E8C6" opacity="0.08" filter="blur(40px)" />

  <!-- Left Mockup Phone (Perspective Back) -->
  <g transform="translate(250, 45) scale(0.85)">
    <rect width="240" height="430" rx="36" fill="#0F1420" stroke="#232B3D" stroke-width="2.5" />
    <!-- Dynamic Island / Speaker -->
    <rect x="85" y="14" width="70" height="18" rx="9" fill="#07090F" />
    <!-- Inner Screen -->
    <rect x="15" y="45" width="210" height="360" rx="24" fill="#151B2B" />
    <rect x="30" y="70" width="120" height="12" rx="4" fill="#E8EEF9" opacity="0.8" />
    <rect x="30" y="95" width="180" height="90" rx="14" fill="#0F1420" stroke="#232B3D" />
    <circle cx="55" cy="140" r="16" fill="#38E8C6" opacity="0.8" />
    <rect x="85" y="130" width="80" height="8" rx="3" fill="#E8EEF9" />
    <rect x="85" y="145" width="50" height="6" rx="2" fill="#8B95AB" />
  </g>

  <!-- Right/Front Mockup Phone -->
  <g transform="translate(370, 20)">
    <!-- Shadow -->
    <rect x="-10" y="10" width="260" height="425" rx="36" fill="#000000" opacity="0.4" />
    <!-- Phone Body -->
    <rect width="240" height="415" rx="36" fill="#0F1420" stroke="#38E8C6" stroke-width="1.5" />
    
    <!-- Speaker / Island -->
    <rect x="85" y="14" width="70" height="18" rx="9" fill="#07090F" />
    
    <!-- Screen -->
    <rect x="12" y="42" width="216" height="355" rx="24" fill="#0B1020" />
    
    <!-- Top Bar -->
    <text x="28" y="72" fill="#8B95AB" font-family="sans-serif" font-size="10">Welcome back,</text>
    <text x="28" y="90" fill="#E8EEF9" font-family="sans-serif" font-size="14" font-weight="bold">Sarah Chen</text>
    <circle cx="205" cy="80" r="14" fill="#232B3D" />

    <!-- Credit Card -->
    <rect x="25" y="110" width="190" height="110" rx="16" fill="url(#card-grad)" />
    <text x="42" y="135" fill="#FFFFFF" font-family="sans-serif" font-size="9" opacity="0.8">Nexora Platinum</text>
    <text x="42" y="175" fill="#FFFFFF" font-family="sans-serif" font-size="14" letter-spacing="2">•••• 8492</text>
    <text x="42" y="202" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">$24,930.50</text>
    <circle cx="185" cy="195" r="12" fill="#FFB547" opacity="0.9" />
    <circle cx="198" cy="195" r="12" fill="#FF5C7A" opacity="0.8" />

    <!-- Quick Action Icons -->
    <g transform="translate(25, 235)">
      <rect x="0" y="0" width="40" height="40" rx="12" fill="#151B2B" stroke="#232B3D" />
      <circle cx="20" cy="20" r="8" fill="#38E8C6" opacity="0.8" />
      
      <rect x="50" y="0" width="40" height="40" rx="12" fill="#151B2B" stroke="#232B3D" />
      <circle cx="70" cy="20" r="8" fill="#FFB547" opacity="0.8" />

      <rect x="100" y="0" width="40" height="40" rx="12" fill="#151B2B" stroke="#232B3D" />
      <circle cx="120" cy="20" r="8" fill="#8B7BFF" opacity="0.8" />

      <rect x="150" y="0" width="40" height="40" rx="12" fill="#151B2B" stroke="#232B3D" />
      <circle cx="170" cy="20" r="8" fill="#3DDC97" opacity="0.8" />
    </g>

    <!-- Recent Transactions Header -->
    <text x="28" y="300" fill="#E8EEF9" font-family="sans-serif" font-size="11" font-weight="600">Transactions</text>
    
    <!-- Item 1 -->
    <rect x="25" y="312" width="190" height="34" rx="8" fill="#151B2B" />
    <circle cx="42" cy="329" r="8" fill="#38E8C6" opacity="0.2" />
    <text x="58" y="333" fill="#E8EEF9" font-family="sans-serif" font-size="9">Stripe Payment</text>
    <text x="175" y="333" fill="#3DDC97" font-family="sans-serif" font-size="9" font-weight="bold">+$450</text>

    <!-- Item 2 -->
    <rect x="25" y="352" width="190" height="34" rx="8" fill="#151B2B" />
    <circle cx="42" cy="369" r="8" fill="#FF5C7A" opacity="0.2" />
    <text x="58" y="373" fill="#E8EEF9" font-family="sans-serif" font-size="9">Cloud Hosting</text>
    <text x="178" y="373" fill="#FF5C7A" font-family="sans-serif" font-size="9" font-weight="bold">-$89</text>
  </g>
</svg>
