<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="web-prev-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1420" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#web-prev-bg)" />

  <!-- App Header -->
  <rect x="0" y="0" width="1000" height="65" fill="#0F1420" stroke="#232B3D" stroke-width="1" />
  <rect x="30" y="20" width="28" height="28" rx="6" fill="#38E8C6" />
  <text x="70" y="38" fill="#E8EEF9" font-family="sans-serif" font-size="16" font-weight="bold">Nexora Analytics Platform</text>
  <rect x="760" y="18" width="100" height="30" rx="6" fill="#151B2B" stroke="#232B3D" />
  <rect x="880" y="18" width="90" height="30" rx="6" fill="#38E8C6" />
  <text x="900" y="38" fill="#04120F" font-family="sans-serif" font-size="12" font-weight="bold">Export</text>

  <!-- Main Grid -->
  <!-- Left Column -->
  <rect x="30" y="95" width="620" height="470" rx="12" fill="#0F1420" stroke="#232B3D" />
  <text x="60" y="135" fill="#E8EEF9" font-family="sans-serif" font-size="18" font-weight="600">Real-Time Traffic Metrics</text>
  <line x1="60" y1="160" x2="620" y2="160" stroke="#232B3D" />
  
  <!-- Metric items -->
  <g transform="translate(60, 190)">
    <rect width="530" height="60" rx="8" fill="#151B2B" />
    <circle cx="30" cy="30" r="14" fill="#38E8C6" fill-opacity="0.2" />
    <text x="60" y="35" fill="#E8EEF9" font-family="sans-serif" font-size="14">API Gateway Requests</text>
    <text x="440" y="35" fill="#38E8C6" font-family="sans-serif" font-size="14" font-weight="bold">1.2M req/sec</text>
  </g>

  <g transform="translate(60, 270)">
    <rect width="530" height="60" rx="8" fill="#151B2B" />
    <circle cx="30" cy="30" r="14" fill="#8B7BFF" fill-opacity="0.2" />
    <text x="60" y="35" fill="#E8EEF9" font-family="sans-serif" font-size="14">Average Latency</text>
    <text x="470" y="35" fill="#8B7BFF" font-family="sans-serif" font-size="14" font-weight="bold">42 ms</text>
  </g>

  <g transform="translate(60, 350)">
    <rect width="530" height="60" rx="8" fill="#151B2B" />
    <circle cx="30" cy="30" r="14" fill="#FFB547" fill-opacity="0.2" />
    <text x="60" y="35" fill="#E8EEF9" font-family="sans-serif" font-size="14">Server Uptime (30d)</text>
    <text x="475" y="35" fill="#FFB547" font-family="sans-serif" font-size="14" font-weight="bold">99.99%</text>
  </g>

  <!-- Right Column -->
  <rect x="675" y="95" width="295" height="470" rx="12" fill="#0F1420" stroke="#232B3D" />
  <text x="705" y="135" fill="#E8EEF9" font-family="sans-serif" font-size="18" font-weight="600">Traffic Source</text>
  <circle cx="820" cy="270" r="85" fill="none" stroke="#232B3D" stroke-width="24" />
  <circle cx="820" cy="270" r="85" fill="none" stroke="#38E8C6" stroke-width="24" stroke-dasharray="320 534" />
  <circle cx="820" cy="270" r="85" fill="none" stroke="#8B7BFF" stroke-width="24" stroke-dasharray="140 534" stroke-dashoffset="-320" />
  <circle cx="820" cy="270" r="85" fill="none" stroke="#FFB547" stroke-width="24" stroke-dasharray="74 534" stroke-dashoffset="-460" />

  <text x="785" y="275" fill="#E8EEF9" font-family="sans-serif" font-size="20" font-weight="bold">82%</text>
  <text x="775" y="295" fill="#8B95AB" font-family="sans-serif" font-size="11">Direct / Organic</text>
</svg>
